name: Barbell Scan

on:
  schedule:
    # 08:00 UTC, Mon-Fri -- premarket, so the alert is already waiting before
    # the trading day starts. That is 04:00 ET under EDT (exactly when the
    # premarket session opens) and 03:00 ET under EST. Cron is UTC-only and
    # does not shift with DST, so the earlier of the two is chosen: the alert
    # is occasionally an hour early, never late.
    #
    # The candle being read is the PREVIOUS session's, settled for hours. Each
    # weekday covers the prior close and Monday covers Friday's, so all five
    # sessions are still scanned -- just reported the next morning, when the
    # signal is actionable, rather than after the close that produced it.
    #
    # Do NOT push this past ~13:00 UTC. Once the US session opens Yahoo stamps
    # a still-forming bar for the current day, and drop_forming_day() discards
    # that only for weekend-trading instruments (crypto); an equity would be
    # evaluated on a partial candle. GitHub's scheduler also drifts 5-20
    # minutes under load, so leave the margin.
    - cron: "0 8 * * 1-5"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore cooldown state and re-alert every active signal"
        type: boolean
        default: false

permissions:
  contents: write

# This job pushes alert state back to the repo, so a manual dispatch must not
# interleave with the scheduled run. Never cancel in progress -- a killed run
# would record alerts in state/ that were never actually delivered.
concurrency:
  group: barbell-repo-state
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # pandas_ta 0.4.x declares Requires-Python >=3.12; anything older
          # fails to resolve at install time.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify indicator math
        # Cheap insurance against a silent pandas_ta API drift: pandas_ta
        # swallows unknown keywords, so a bad upgrade would compute the wrong
        # sigma rather than error. Never alert on unverified bands.
        run: |
          python tests/test_pipeline.py
          python tests/test_study.py

      - name: Run scan
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scan.py ${{ inputs.force && '--force' || '' }}

      - name: Commit alert state
        run: |
          git config user.name  "barbell-scanner[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --staged --quiet; then
            echo "No state change."
            exit 0
          fi
          git commit -m "chore(state): alert state $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
